<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f01920">
  <meta name="robots" content="noindex,nofollow">
  <title>Data Warriors · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/data-warriors.css">
  <style>
    body.adm-mode{background:var(--bg-2)}
    .adm-gate{max-width:460px;margin:16vh auto;text-align:center;padding:0 var(--gutter)}
    .adm-gate h1{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
    .adm-gate p{color:var(--muted);font-size:14.5px;line-height:1.6}
    .adm-gate a{color:var(--red);font-weight:700;text-decoration:none}
    .adm-spin{width:30px;height:30px;border:3px solid var(--line-2);border-top-color:var(--red);border-radius:50%;animation:admspin .8s linear infinite;margin:0 auto 16px}
    @keyframes admspin{to{transform:rotate(360deg)}}
    .adm-ov{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .adm-ov .kpi strong{font-size:26px}
    .adm-table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    table.adm{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
    table.adm th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
    table.adm td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
    table.adm tr:last-child td{border-bottom:0}
    table.adm tbody tr:hover{background:var(--bg-2)}
    .adm-name b{font-weight:700}
    .adm-name span{display:block;color:var(--muted);font-size:11.5px}
    .adm-daypill{font-weight:700;font-family:var(--display);color:var(--red-ink);background:var(--pale);border:1px solid var(--red-line);border-radius:999px;padding:3px 9px;font-size:12px;white-space:nowrap}
    .adm-daypill.zero{color:var(--muted);background:#f4f4f5;border-color:var(--line)}
    .adm-done{color:var(--green);font-weight:700}
    .adm-links a{color:var(--red-ink);text-decoration:none;margin-right:8px;font-weight:600}
    .adm-links a:hover{text-decoration:underline}
    .adm-tag{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 7px}
    .adm-tag.ok{color:var(--green);background:var(--green-soft);border:1px solid var(--green-line)}
    .adm-tag.no{color:var(--muted);background:#f4f4f5;border:1px solid var(--line)}
    .adm-req{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap}
    .adm-req .rq-actions{display:flex;gap:8px}
    .adm-search{width:100%;max-width:340px;border:1px solid var(--line);border-radius:11px;padding:10px 14px;font:14px var(--font);background:#fff;color:var(--ink);margin-bottom:14px}
    @media (max-width:760px){ .adm-ov{grid-template-columns:repeat(2,1fr)} }
  </style>
</head>
<body class="adm-mode">
  <div id="admRoot">
    <div class="adm-gate"><div class="adm-spin"></div><p>Checking access…</p></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/data-warriors-admin.js" defer></script>
</body>
</html>
